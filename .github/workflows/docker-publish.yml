---
name: Docker Publish

on:
  push:
    branches: ["main"]
    # 历史 semver 风格 tag（bullseye 分支沿用）；CalVer tag 由本 workflow 自己创建
    tags: ["v*.*.*", "*-v*"]
  pull_request:
    branches: ["main"]
  # 每月 1 日 04:00 UTC 的从零构建巡检（canary）：不推送、不建 tag，只负责发现漂移与损坏
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 Git 标签（例如 bullseye-v1.0）；留空则按今天的日期发布'
        required: false
        type: string
        default: ''
      canary:
        description: '只做巡检（从零构建 + 冒烟 + 漂移 + CVE），不发布任何镜像'
        type: boolean
        default: false

env:
  # 留空即代表使用 Docker Hub（docker.io）这个 registry
  GHCR_REGISTRY: ghcr.io
  HUB_REGISTRY: docker.io
  # github.repository 的形式为 <account>/<repo>（保留大小写）
  GHCR_IMAGE_NAME: ${{ github.repository }}
  HUB_IMAGE_NAME: ${{ vars.DOCKERHUB_ACCOUNT }}/${{ vars.DOCKERHUB_REPO }}
  # 包清单守门的基线镜像名在步骤内计算：GHCR 要求仓库路径全小写，
  # 而 github.repository 保留了大小写（Shuery-Shuai/...），直接引用会 404。

jobs:
  # 廉价守门（PR 与 push 都跑，绝不建镜像）：hadolint 查 Dockerfile，actionlint 查
  # workflows 目录，yamllint 查 workflows 与 dependabot 配置。三者都只读，工具来自
  # 官方容器镜像或固定版本的 pip 包，不引入任何新的第三方 action。
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 工具镜像同时写出版本 tag 与 digest（digest 是权威引用，tag 供人读）；
      # tag 与 digest 的对应关系已在本地用 docker inspect 的 RepoDigests 核对过。
      HADOLINT_IMAGE: >-
        hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
      ACTIONLINT_IMAGE: >-
        rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      YAMLLINT_VERSION: "1.38.0"
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 本仓库的 CI 不给容器做 bind 挂载：Dockerfile 与 .github/lint 下的守门配置
      # 一起用 tar 走 stdin 送进容器解包，容器内按相对路径读取它们。
      # 分级策略靠 --failure-threshold error 表达：只有 error 级发现让退出码非零
      # 从而阻断，style/info/warning 照常打印并写进 Step Summary，但保持绿灯。
      # 容器以非 root 用户运行，只有 /tmp 可写，故解包目标为 /tmp/lint。
      - name: Dockerfile 检查（hadolint）
        shell: bash
        run: |
          set -uo pipefail
          extract='mkdir -p /tmp/lint && tar -x -C /tmp/lint && cd /tmp/lint &&'
          hd_args='--no-color --failure-threshold error --config .github/lint/hadolint.yml'
          findings="$(tar -c Dockerfile .github |
            docker run --rm -i --entrypoint /bin/sh "${HADOLINT_IMAGE}" \
              -c "${extract} hadolint ${hd_args} - < Dockerfile")"
          rc=$?
          printf '%s\n' "${findings}"
          {
            echo '### hadolint（Dockerfile）'
            echo ''
            echo '```text'
            printf '%s\n' "${findings:-无发现}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

      # 只看 workflows 目录：actionlint 会把交给它的任何 YAML 当 workflow 解析，
      # 而 .github/dependabot.yml 合法地没有 on: 与 jobs: 两个 section，交给它只会
      # 得到 4 条假语法错误，所以必须把范围收窄到 .github/workflows/。
      # 镜像自带 shellcheck，显式给出其路径以确保内联 shell 真的被检查过。
      - name: Workflow 检查（actionlint）
        shell: bash
        run: |
          set -uo pipefail
          extract='mkdir -p /tmp/lint && tar -x -C /tmp/lint && cd /tmp/lint &&'
          wf_glob='.github/workflows/*.yml'
          findings="$(tar -c .github |
            docker run --rm -i --entrypoint /bin/sh "${ACTIONLINT_IMAGE}" \
              -c "${extract} actionlint -shellcheck /usr/local/bin/shellcheck -no-color ${wf_glob}")"
          rc=$?
          printf '%s\n' "${findings}"
          {
            echo '### actionlint（.github/workflows）'
            echo ''
            echo '```text'
            printf '%s\n' "${findings:-无发现}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # actionlint 的发现一律视为必须修：要么是 Actions 语义错误，
          # 要么是 shellcheck 报出的脚本缺陷，不存在可放行的风格噪声。
          exit "${rc}"

      # 目标同时包含 workflows 与 dependabot 配置：前者是 Actions 契约，
      # 后者同样是人要读的 YAML，风格漂移的代价一样。
      - name: YAML 风格检查（yamllint）
        shell: bash
        run: |
          set -uo pipefail
          # 版本固定，口径与仓库其余部分一致：避免检查结果随上游发版漂移。
          venv="${RUNNER_TEMP}/venv-yamllint"
          python3 -m venv "${venv}"
          "${venv}/bin/pip" install --quiet --disable-pip-version-check \
            "yamllint==${YAMLLINT_VERSION}"
          "${venv}/bin/yamllint" --version
          findings="$("${venv}/bin/yamllint" -c .github/lint/yamllint.yml -f parsable \
            .github/workflows/ .github/dependabot.yml)"
          rc=$?
          printf '%s\n' "${findings}"
          {
            echo '### yamllint（workflows + dependabot）'
            echo ''
            echo '```text'
            printf '%s\n' "${findings:-无发现}"
            echo '```'
            echo ''
            echo '分级口径：yamllint 仅在存在 error 级发现时返回非零（阻断）；'
            echo '纯 warning（风格级）返回 0，只在此处报告；真超 120 列的行必须折行。'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

  # 目录结构守门（防复发）：旧的 scripts 目录曾把 apt 配置片段、包清单、vendored 上游脚本、CI 校验脚本
  # 混在一层，现已按**消费方**拆为 build/ + vendor/ + ci/。本 job 只查结构、不建镜像，
  # 因此很便宜；它同时防止两类复发：把文件放回旧 scripts 目录，或在新目录/仓库根乱丢未登记文件。
  # 该步骤现在执行 ci/check_structure.sh：守门清单与断言都在脚本里，
  # 脚本只依赖 git ls-files / git ls-files --others，本地跑同一条命令即可复现同一退出码。
  structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 目录结构守门
        shell: bash
        run: bash ci/check_structure.sh

  build:
    # 结构不对就不要浪费一次镜像构建
    needs:
      - lint
      - structure
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.canary)
    runs-on: ubuntu-latest
    # 同一 ref 的发布串行化：避免两次 main 推送在同一窗口抢跑、互相覆盖 tag
    concurrency:
      group: docker-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      # PR 上把 CI 证据报告（包清单 diff / 体积）作为评论发回 PR
      pull-requests: write
      # 非 PR 场景下用它完成 identity challenge，
      # 从而向 sigstore/fulcio 换取签发证书。
      id-token: write

    steps:
      # 手动提供了 tag 就在该 tag 上检出仓库，
      # 否则检出默认分支。
      - name: 按手动提供的 tag 检出仓库
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}

      # 未手动提供 tag 时，在默认分支上检出仓库。
      - name: 检出仓库（默认分支）
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.tag == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 安装 cosign 工具（PR 上跳过）
      # https://github.com/sigstore/cosign-installer
      - name: 安装 cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # 建立 BuildKit Docker container builder，
      # 以便构建多平台镜像并导出缓存
      # https://github.com/docker/setup-buildx-action
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # 登录 Docker registry（PR 上跳过）
      # https://github.com/docker/login-action
      - name: 登录 registry ${{ env.GHCR_REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 registry ${{ env.HUB_REGISTRY }}
        if: github.event_name!= 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.HUB_REGISTRY }}
          username: ${{ vars.DOCKERHUB_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 计算本次发布的不可变 tag：CalVer bookworm-YYYY.MM.DD[.n]（同日多次发布追加序号）
      # 由 tag 推送触发时直接沿用该 tag；由 main 推送或手动 dispatch（tag 留空）触发时按日期生成。
      - name: 计算发布 tag
        id: release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME}"
            IS_MAIN="false"
          elif [ -n "${INPUT_TAG}" ]; then
            NAME="${INPUT_TAG}"
            IS_MAIN="false"
          else
            BASE="bookworm-$(date -u +%Y.%m.%d)"
            EXISTING="$(git ls-remote --tags --refs origin | awk '{print $2}' | sed 's|refs/tags/||')"
            NAME="$BASE"
            n=0
            while printf '%s\n' "$EXISTING" | grep -qx "$NAME"; do
              n=$((n + 1))
              NAME="$BASE.$n"
            done
            IS_MAIN="true"
          fi
          ALIAS=""
          case "$NAME" in
            bookworm-*) ALIAS="bookworm" ;;
            bullseye-*) ALIAS="bullseye" ;;
            *-v*) ALIAS="${NAME%%-*}" ;;
          esac
          {
            echo "name=$NAME"
            echo "is_main=$IS_MAIN"
            echo "extra_tags<<EOF"
            echo "type=raw,value=$NAME"
            if [ -n "$ALIAS" ]; then echo "type=raw,value=$ALIAS"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "本次发布 tag: ${NAME}（浮动别名: ${ALIAS:-无}）"

      # 提取 Docker 镜像的元数据（tags、labels）
      # https://github.com/docker/metadata-action
      - name: 提取 Docker 镜像元数据
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.HUB_REGISTRY }}/${{ env.HUB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.is_main == 'true' }}
            ${{ steps.release.outputs.extra_tags }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Router Firmware Builder — 用于构建路由器固件编译的 Docker 环境。
            org.opencontainers.image.licenses=MIT

      # 先在本地构建并冒烟：**任何路径（含发布）都必须先验证再推送**，
      # 因此这里不推送、只 load；随后的推送构建命中同一份缓存，代价很小。
      - name: 构建（本地，供验证）
        id: verify-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: rtfw-builder:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        if: always()
        run: |
          if ! docker image inspect rtfw-builder:verify >/dev/null 2>&1; then
            echo "本地无待验证镜像（构建步骤未产出），跳过"
            exit 0
          fi
          docker run --rm \
            -v "$PWD/ci/smoke-test.sh:/smoke-test.sh:ro" \
            rtfw-builder:verify \
            bash /smoke-test.sh

      # ---- 以下为 PR 上的证据步骤（docs/OPTIMIZATION.md §6、§7）----

      - name: 包清单 (PR only)
        if: always() && github.event_name == 'pull_request'
        run: |
          ID="${{ steps.verify-build.outputs.imageid }}"
          if [ -z "$ID" ]; then
            echo "构建未产出镜像，跳过包清单"
            exit 0
          fi
          docker run --rm "$ID" \
            dpkg-query -W -f='${Package}\t${Version}\n' | sort > packages-candidate.txt
          printf '候选镜像包数: %s\n' "$(wc -l < packages-candidate.txt | tr -d ' ')"

      - name: 包清单守门 vs 已发布镜像 (PR only)
        if: always() && github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          {
            echo "## CI 证据报告"
            echo ""
            echo "- 提交：\`${{ github.sha }}\`"
            echo ""
          } > ci-report.md
          ID="${{ steps.verify-build.outputs.imageid }}"
          if [ -z "$ID" ]; then
            echo "构建未产出镜像，跳过包清单守门"
            echo "跳过：构建未产出镜像。" >> ci-report.md
            exit 0
          fi
          BASELINE_IMAGE="ghcr.io/$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):latest"
          if ! docker pull "$BASELINE_IMAGE" >/dev/null 2>&1; then
            echo "::warning::无法拉取 baseline 镜像 ${BASELINE_IMAGE}，跳过包清单守门"
            {
              echo "### 包清单 diff"
              echo ""
              echo "跳过：无法拉取 baseline 镜像 \`$BASELINE_IMAGE\`。"
            } | tee -a ci-report.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          bash ci/package-diff.sh "$BASELINE_IMAGE" "$ID" | tee -a ci-report.md

      - name: 镜像体积报告 (PR only)
        if: always() && github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          ID="${{ steps.verify-build.outputs.imageid }}"
          if [ -z "$ID" ]; then
            echo "构建未产出镜像，跳过体积报告"
            exit 0
          fi
          UNCOMPRESSED="$(docker image inspect -f '{{.Size}}' "$ID")"
          COMPRESSED="$(docker save "$ID" | gzip -6 | wc -c | tr -d ' ')"
          {
            echo "### 镜像体积（PR 构建）"
            echo ""
            echo "| 口径 | 数值 |"
            echo "| --- | --- |"
            echo "| 未压缩（docker inspect .Size） | $(numfmt --to=iec "$UNCOMPRESSED") |"
            echo "| 整包 gzip 估算 | $(numfmt --to=iec "$COMPRESSED") |"
            echo ""
            echo "验收目标 ≤ 1000 MB 以注册表分层压缩合计为准（发布后核对）；此处仅作 PR 间可比基线。"
          } | tee -a ci-report.md >> "$GITHUB_STEP_SUMMARY"

      # 把证据报告作为 PR 评论发布：CI 日志需要鉴权才能读取，评论可以匿名读，
      # 便于会话/外部工具直接取用（同一条评论会被后续运行覆写，不会刷屏）。
      - name: 发布 CI 证据报告到 PR (PR only)
        # fork / Dependabot 的 PR 拿不到 pull-requests: write，评论会 403。
        # 这类 PR 直接跳过评论（Step Summary 与 artifact 照常产出），并加 continue-on-error 兜底，
        # 否则每周一的 Dependabot PR 都会显示一次假红。
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s ci-report.md ]; then
            echo "无证据报告，跳过"
            exit 0
          fi
          PR="${{ github.event.pull_request.number }}"
          gh pr comment "$PR" --body-file ci-report.md --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file ci-report.md

      - name: 上传 CI 证据产物 (PR only)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-evidence-pr-${{ github.event.number }}
          path: |
            ci-report.md
            packages-candidate.txt
          retention-days: 30

      # 推送构建：命中上面的缓存，只多出导出与推送的代价；SBOM attestation 在此生成。
      - name: 构建并推送 Docker 镜像
        id: build-and-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # 对产出的 Docker 镜像 digest 签名（PR 上跳过）。
      # 只有当 Docker 仓库是公开仓库时才会写入公开的 Rekor 透明度日志，以免泄漏数据；
      # 若希望私有镜像也公开透明度数据，请在下面的 cosign 命令里加上 --force。
      # https://github.com/sigstore/cosign
      - name: 为已发布的 Docker 镜像签名
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # 本步骤用 identity token 向 sigstore 社区的 Fulcio 实例
        # 申请一张临时证书。
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"

      # 签名后立刻验证：把"能签"与"能验"两端都锁在 CI 里，避免 README 里的验证命令成为空话
      - name: 校验签名 (cosign verify)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -uo pipefail
          IDENTITY="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.+@refs/(heads|tags)/.+$"
          ISSUER="https://token.actions.githubusercontent.com"
          FAILED=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            echo "verify ${ref}@${DIGEST}"
            cosign verify "${ref}@${DIGEST}" \
              --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" >/dev/null || FAILED=1
          done <<< "${TAGS}"
          [ "$FAILED" -eq 0 ] || { echo "::error::cosign verify 失败"; exit 1; }

      # 创建不可变 tag 与 GitHub Release（CalVer；tag 一旦发布永不重写）
      - name: 创建不可变 tag 与 Release
        if: steps.release.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.release.outputs.name }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: bash ci/publish_release.sh

  # 每月一次的从零构建巡检：完全不推送，只回答两个问题——
  #   1. 这套构建今天还能从零跑通吗（远端源是否消失或改行为）？
  #   2. 上游脚本是否已经漂移（vendor 版本是否需要人工同步）？
  # 失败或漂移都会开（或更新）一个 Issue。
  canary:
    # 巡检同样先过 lint：每月的从零构建很贵，不值得为一次已知的 lint 失败买单。
    needs: lint
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.canary)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: 从零构建（no-cache，不推送）
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          tags: rtfw-builder:canary

      - name: 冒烟测试
        id: smoke
        run: |
          docker run --rm \
            -v "$PWD/ci/smoke-test.sh:/smoke-test.sh:ro" \
            rtfw-builder:canary bash /smoke-test.sh

      - name: 上游脚本漂移检查
        id: drift
        if: always()
        run: |
          set -uo pipefail
          LOCKED="$(grep '^COMMIT=' vendor/upstream.lock | cut -d= -f2)"
          HEAD="$(git ls-remote https://github.com/immortalwrt/build-scripts.git refs/heads/master | cut -f1)"
          printf '锁定 commit: %s\n上游 commit: %s\n' "$LOCKED" "$HEAD"
          if [ -z "$HEAD" ]; then
            echo "::error::无法获取上游 master HEAD，本次未做比较——不得当成无漂移"
            echo "drifted=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$LOCKED" != "$HEAD" ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: CVE 扫描（只报告，不阻断）
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: rtfw-builder:canary
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: "0"
          output: trivy-report.txt

      # 每月一条滚动 Issue：把"还能从零构建吗 / 上游漂移了吗 / CVE 有多少"放在同一处，
      # 否则报告只会躺在流水线里无人查看。CVE 仅提示，不阻断任何发布。
      - name: 汇总月度巡检报告（滚动 Issue）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          case "${{ steps.drift.outputs.drifted }}" in
            true) DRIFT="是（需要人工同步 vendor/init_build_environment.sh，流程见 vendor/README.md）" ;;
            unknown) DRIFT="未知（上游 HEAD 获取失败，本次未比较）" ;;
            *) DRIFT="否" ;;
          esac
          CRIT="n/a"
          HIGH="n/a"
          if [ -s trivy-report.txt ]; then
            CRIT="$(grep -o 'CRITICAL: [0-9]*' trivy-report.txt | awk '{s+=$2} END {print s+0}')"
            HIGH="$(grep -o 'HIGH: [0-9]*' trivy-report.txt | awk '{s+=$2} END {print s+0}')"
          fi
          {
            echo "## 巡检结果（$(date -u +%Y-%m-%d)）"
            echo ""
            echo "| 检查项 | 结果 |"
            echo "| --- | --- |"
            echo "| 从零构建（no-cache） | ${{ steps.build.outcome || 'skipped' }} |"
            echo "| 冒烟测试 | ${{ steps.smoke.outcome || 'skipped' }} |"
            echo "| 上游脚本漂移 | ${DRIFT} |"
            echo "| CVE（CRITICAL / HIGH） | ${CRIT} / ${HIGH} |"
            echo ""
            echo "运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "锁定的上游 commit 见 \`vendor/upstream.lock\`；CVE 结果仅作提示，不阻断发布。"
          } > canary-report.md
          if [ -s trivy-report.txt ]; then
            {
              echo ""
              echo "<details><summary>trivy 扫描结果（CRITICAL / HIGH）</summary>"
              echo ""
              echo '```'
              head -n 80 trivy-report.txt
              echo '```'
              echo ""
              echo "</details>"
            } >> canary-report.md
          fi
          NUM="$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title | startswith("[canary]"))][0].number // empty')"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file canary-report.md
          else
            gh issue create --title "[canary] 构建环境巡检（月度滚动报告）" --body-file canary-report.md
          fi
