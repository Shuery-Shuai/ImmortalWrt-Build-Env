name: Docker Publish

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # schedule:
  #   - cron: "30 12 * * *"
  push:
    branches: ["main"]
    # Publish semver tags as releases.
    tags: ["v*.*.*", "*-v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 Git 标签（例如 bullseye-v1.0）'
        required: false
        type: string
        default: ''

env:
  # Use docker.io for Docker Hub if empty
  GHCR_REGISTRY: ghcr.io
  HUB_REGISTRY: docker.io
  # github.repository as <account>/<repo>
  GHCR_IMAGE_NAME: ${{ github.repository }}
  HUB_IMAGE_NAME: ${{ vars.DOCKERHUB_ACCOUNT }}/${{ vars.DOCKERHUB_REPO }}
  # PR 上的包清单守门基线：上一版已发布镜像
  BASELINE_IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      # Checkout the repository at the tag if provided manually,
      # otherwise checkout the default branch.
      - name: Checkout tag if provided manually
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}

      # Checkout the repository at the default branch if no tag is provided manually.
      - name: Checkout repository (default)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.tag == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.3"

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.GHCR_REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into registry ${{ env.HUB_REGISTRY }}
        if: github.event_name!= 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.HUB_REGISTRY }}
          username: ${{ vars.DOCKERHUB_ACCOUNT }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate extra tags from git tag for Docker metadata
      - name: Generate extra tags
        id: gen-tags
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        run: |
          TAGS=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            DISTRO="${TAG_NAME%-v*}"
            if [[ "$DISTRO" != "$TAG_NAME" ]]; then
              TAGS+=$'type=raw,value='"$DISTRO"$'\n'
            fi
            TAGS+=$'type=raw,value='"$TAG_NAME"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            DISTRO="${INPUT_TAG%-v*}"
            if [[ "$DISTRO" != "$INPUT_TAG" ]]; then
              TAGS+=$'type=raw,value='"$DISTRO"$'\n'
            fi
            TAGS+=$'type=raw,value='"$INPUT_TAG"
          fi
          echo 'extra_tags<<EOF' >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.HUB_REGISTRY }}/${{ env.HUB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.tag == '') }}
            ${{ steps.gen-tags.outputs.extra_tags }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=用于构建 ImmortalWrt 固件编译的 Docker 环境。
            org.opencontainers.image.licenses=MIT

      # Build and push Docker image with Buildx (don't push on PR).
      # 在 PR 上改为 --load 到本地 runner，供后续冒烟/包清单/体积检查使用。
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 以下为 PR 上的证据步骤（docs/OPTIMIZATION.md §6、§7）----

      - name: 冒烟测试 (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            -v "$PWD/scripts/smoke-test.sh:/smoke-test.sh:ro" \
            "${{ steps.build-and-push.outputs.imageid }}" \
            bash /smoke-test.sh

      - name: 包清单 (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm "${{ steps.build-and-push.outputs.imageid }}" \
            dpkg-query -W -f='${Package}\t${Version}\n' | sort > packages-candidate.txt
          printf '候选镜像包数: %s\n' "$(wc -l < packages-candidate.txt | tr -d ' ')"

      - name: 包清单守门 vs 已发布镜像 (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if ! docker pull "$BASELINE_IMAGE" >/dev/null 2>&1; then
            echo "::warning::无法拉取 baseline 镜像 $BASELINE_IMAGE，跳过包清单守门"
            {
              echo "### 包清单 diff"
              echo ""
              echo "跳过：无法拉取 baseline 镜像 \`$BASELINE_IMAGE\`。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash scripts/package-diff.sh "$BASELINE_IMAGE" "${{ steps.build-and-push.outputs.imageid }}"

      - name: 镜像体积报告 (PR only)
        if: github.event_name == 'pull_request'
        run: |
          ID="${{ steps.build-and-push.outputs.imageid }}"
          UNCOMPRESSED="$(docker image inspect -f '{{.Size}}' "$ID")"
          COMPRESSED="$(docker save "$ID" | gzip -6 | wc -c | tr -d ' ')"
          {
            echo "### 镜像体积（PR 构建）"
            echo ""
            echo "| 口径 | 数值 |"
            echo "| --- | --- |"
            echo "| 未压缩（docker inspect .Size） | $(numfmt --to=iec "$UNCOMPRESSED") |"
            echo "| 整包 gzip 估算 | $(numfmt --to=iec "$COMPRESSED") |"
            echo ""
            echo "验收目标 ≤ 1000 MB 以注册表分层压缩合计为准（发布后核对）；此处仅作 PR 间可比基线。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传包清单产物 (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-pr-${{ github.event.number }}
          path: packages-candidate.txt
          retention-days: 30

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
