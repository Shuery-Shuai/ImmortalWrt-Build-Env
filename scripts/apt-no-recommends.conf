# 关闭推荐包/建议包的自动安装（依据见 docs/OPTIMIZATION.md §6）。
#
# 量化依据：以本镜像包集合为种子，Debian bookworm 的 Depends 闭包为 484 包 / 2.2 GB，
# 而 Depends + Recommends 闭包为 1042 包 / 4.8 GB —— 仅 Recommends 就引入 558 包 / 2.6 GB，
# 其中 texlive 全家族、mupdf-tools、libicu-dev、asciidoc-dblatex、bash-completion 等
# 与固件编译链无关。经审计判定为"承重"的推荐包已显式列在 scripts/packages.txt 中。
#
# 这个文件必须在任何 apt 操作之前生效：Dockerfile 在第一个 RUN 之前就把它放进 apt.conf.d，
# 因此它也约束 vendored 上游脚本内部的 apt install / apt full-upgrade。
APT::Install-Recommends "false";
APT::Install-Suggests "false";
